name: Build WASM & Bindings

on:
  pull_request:
  push:
    branches:
      - main
      - feature/**

permissions:
  contents: read

concurrency:
  group: wasm-bindings-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-wasm:
    name: WASM + bindings (no secrets)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: 1.99.1
          targets: wasm32-unknown-unknown

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-wasm-bindings-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-wasm-bindings-

      - name: Install pinned Stellar CLI (22.8.2)
        run: |
          set -euo pipefail
          curl -sSL \
            https://github.com/stellar/stellar-cli/releases/download/v22.8.2/stellar-cli-22.8.2-x86_64-unknown-linux-gnu.tar.gz \
            -o /tmp/stellar-cli.tar.gz
          echo "faeaec7f7a16c008f25c8b9a6d5fb047831e97b74c85336db4f6ad5877ae9c4f  /tmp/stellar-cli.tar.gz" \
            | sha256sum -c -
          sudo tar -xzf /tmp/stellar-cli.tar.gz -C /usr/local/bin stellar
          stellar --version

      - name: Build both contracts reproducibly
        run: bash scripts/build_wasm.sh all

      - name: Check committed bindings for drift
        run: bash scripts/check-bindings.sh --skip-build

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install binding workspaces
        run: npm ci

      - name: Build and smoke-test TypeScript bindings
        run: npm test

      - name: Upload WASM artifacts
        uses: actions/upload-artifact@v4
        with:
          name: soroban-wasm
          path: |
            target/wasm32-unknown-unknown/release/creditra_credit.wasm
            target/wasm32-unknown-unknown/release/gateway_auction.wasm
          if-no-files-found: error
          retention-days: 14
